<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Mini DAYZ - Web Edition</title>

    <link rel="manifest" href="appmanifest.json" />
    <link rel="icon" type="image/png" sizes="256x256" href="icon-256.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -ms-touch-action: none;
            font-family: Arial, sans-serif;
        }
        canvas {
            touch-action-delay: none;
            touch-action: none;
            -ms-touch-action: none;
            image-rendering: auto;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: transform 0.35s ease;
        }
        /* ── 竖屏模式：容器旋转 90° ── */
        #game-container.portrait {
            transform: rotate(90deg);
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-text {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #loading-bar-bg {
            width: 200px;
            height: 3px;
            background: #222;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        #loading-bar {
            width: 0%;
            height: 100%;
            background: #4a4;
            transition: width 0.4s ease;
        }
        #kb-hint {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #555;
            font-size: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        /* ── 方向设置面板 ── */
        #orientation-settings {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        #orientation-toggle {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background 0.2s, color 0.2s;
        }
        #orientation-toggle:hover, #orientation-toggle.active {
            background: rgba(0,0,0,0.75);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }
        #orientation-menu {
            display: none;
            flex-direction: column;
            gap: 2px;
            background: rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 4px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #orientation-menu.visible { display: flex; }
        #orientation-menu button {
            background: none;
            border: 1px solid transparent;
            color: #bbb;
            font-size: 12px;
            padding: 7px 14px;
            text-align: left;
            cursor: pointer;
            border-radius: 5px;
            white-space: nowrap;
            transition: all 0.15s;
        }
        #orientation-menu button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        #orientation-menu button.selected {
            color: #5f5;
            border-color: rgba(100,255,100,0.4);
            background: rgba(100,255,100,0.08);
        }

        /* 输入代理层 — 竖屏时拦截并转换坐标 */
        #input-proxy {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9000;
            background: transparent;
            touch-action: none;
        }
        #input-proxy.active { display: block; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div id="loading-text">Mini DAYZ Loading</div>
        <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    </div>

    <div id="game-container">
        <div id="c2canvasdiv">
            <canvas id="c2canvas" width="1024" height="768">
                <h1>Your browser does not support HTML5. Please upgrade.</h1>
            </canvas>
        </div>
    </div>

    <!-- 输入代理层 — 竖屏时拦截触摸/鼠标事件 -->
    <div id="input-proxy"></div>

    <!-- 方向设置 -->
    <div id="orientation-settings">
        <button id="orientation-toggle" title="Screen Orientation">&#x2699;</button>
        <div id="orientation-menu">
            <button data-mode="auto"   class="selected">Auto</button>
            <button data-mode="landscape">Landscape</button>
            <button data-mode="portrait">Portrait</button>
        </div>
    </div>

    <div id="kb-hint">WASD move &bull; Mouse click interact</div>

    <!-- Cordova API polyfill for pure browser environment -->
    <script src="cordova-polyfill.js"></script>

    <!-- Core game engine -->
    <script src="jquery-3.4.1.min.js"></script>
    <script src="c2runtime.js"></script>

    <!-- AI Modules -->
    <script src="src/ai_modules/ai_helpers.js"></script>
    <script src="src/ai_modules/damage_system.js"></script>
    <script src="src/ai_modules/world/map_generation.js"></script>
    <script src="src/ai_modules/world/spawn_parameters.js"></script>
    <script src="src/ai_modules/world/environment.js"></script>
    <script src="src/ai_modules/world/environment_effects.js"></script>
    <script src="src/ai_modules/world/buildings.js"></script>
    <script src="src/ai_modules/world/light_parameters.js"></script>
    <script src="src/ai_modules/world/timeline.js"></script>
    <script src="src/ai_modules/player/player_stats.js"></script>
    <script src="src/ai_modules/player/interaction.js"></script>
    <script src="src/ai_modules/player/experience.js"></script>
    <script src="src/ai_modules/player/animations.js"></script>
    <script src="src/ai_modules/player/characters.js"></script>
    <script src="src/ai_modules/zombies/zeds_common.js"></script>
    <script src="src/ai_modules/zombies/normal_puncher.js"></script>
    <script src="src/ai_modules/zombies/fast_puncher.js"></script>
    <script src="src/ai_modules/zombies/army_puncher.js"></script>
    <script src="src/ai_modules/zombies/buried_puncher.js"></script>
    <script src="src/ai_modules/zombies/army_shooters.js"></script>
    <script src="src/ai_modules/zombies/screamer.js"></script>
    <script src="src/ai_modules/zombies/tank.js"></script>
    <script src="src/ai_modules/zombies/jumper.js"></script>
    <script src="src/ai_modules/bots.js"></script>
    <script src="src/ai_modules/animals.js"></script>
    <script src="src/ai_modules/npc_controller.js"></script>
    <script src="src/ai_modules/vehicles/drivable_vehicles.js"></script>
    <script src="src/ai_modules/gui/hud.js"></script>
    <script src="src/ai_modules/system/save_system.js"></script>
    <script src="src/ai_modules/system/game_init.js"></script>
    <script src="src/game-main.js"></script>

    <script>
    (function() {
        var canvas = document.getElementById('c2canvas');
        var container = document.getElementById('game-container');
        var loadingScreen = document.getElementById('loading-screen');
        var loadingBar = document.getElementById('loading-bar');
        var inputProxy = document.getElementById('input-proxy');
        var GAME_W = 1024, GAME_H = 768;

        // ═══════════════════════════════════════
        // Orientation system
        // ═══════════════════════════════════════
        var ORIENTATION_MODE = localStorage.getItem('mdz_orientation') || 'auto';
        var isPortraitMode = false;

        function getEffectiveOrientation() {
            if (ORIENTATION_MODE === 'portrait') return 'portrait';
            if (ORIENTATION_MODE === 'landscape') return 'landscape';
            // auto: follow device
            return (window.innerHeight > window.innerWidth) ? 'portrait' : 'landscape';
        }

        function applyOrientation() {
            var ori = getEffectiveOrientation();
            isPortraitMode = (ori === 'portrait');

            if (isPortraitMode) {
                container.classList.add('portrait');
                inputProxy.classList.add('active');
            } else {
                container.classList.remove('portrait');
                inputProxy.classList.remove('active');
            }

            // Update menu selection
            var btns = document.querySelectorAll('#orientation-menu button');
            btns.forEach(function(b) {
                b.classList.toggle('selected', b.getAttribute('data-mode') === ORIENTATION_MODE);
            });

            resizeCanvas();
        }

        // ═══════════════════════════════════════
        // Coordinate transform — screen → canvas
        // In portrait: CSS rotate(90deg) on container,
        // so visual (vx,vy) maps to canvas (ny*W, (1-nx)*H)
        // ═══════════════════════════════════════
        function screenToCanvas(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();

            if (isPortraitMode) {
                // Visual rect dimensions are swapped due to CSS rotation
                var nx = (clientX - rect.left) / rect.width;
                var ny = (clientY - rect.top) / rect.height;
                nx = Math.max(0, Math.min(1, nx));
                ny = Math.max(0, Math.min(1, ny));
                return {
                    x: ny * GAME_W,
                    y: (1 - nx) * GAME_H
                };
            } else {
                var nx2 = (clientX - rect.left) / rect.width;
                var ny2 = (clientY - rect.top) / rect.height;
                return {
                    x: nx2 * GAME_W,
                    y: ny2 * GAME_H
                };
            }
        }

        // Inverse: canvas coords → screen clientX/Y
        function canvasToScreen(cx, cy) {
            var rect = canvas.getBoundingClientRect();

            if (isPortraitMode) {
                // Canvas (cx, cy) → normalized canvas → visual
                var nx = 1 - (cy / GAME_H);  // canvas y reversed → visual x
                var ny = cx / GAME_W;        // canvas x → visual y
                return {
                    x: rect.left + nx * rect.width,
                    y: rect.top  + ny * rect.height
                };
            } else {
                return {
                    x: rect.left + (cx / GAME_W) * rect.width,
                    y: rect.top  + (cy / GAME_H) * rect.height
                };
            }
        }

        // ═══════════════════════════════════════
        // Responsive canvas
        // ═══════════════════════════════════════
        function resizeCanvas() {
            var ww = window.innerWidth;
            var wh = window.innerHeight;
            // In portrait mode, canvas appears rotated, so swap target dimensions
            var tw = isPortraitMode ? GAME_H : GAME_W;
            var th = isPortraitMode ? GAME_W : GAME_H;
            var scale = Math.min(ww / tw, wh / th);
            canvas.style.width  = Math.floor(GAME_W * scale) + 'px';
            canvas.style.height = Math.floor(GAME_H * scale) + 'px';
        }

        window.addEventListener('resize', function() {
            applyOrientation();
        });
        window.addEventListener('orientationchange', function() {
            setTimeout(applyOrientation, 120);
        });

        // ═══════════════════════════════════════
        // Settings menu
        // ═══════════════════════════════════════
        var toggleBtn = document.getElementById('orientation-toggle');
        var menuDiv = document.getElementById('orientation-menu');

        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            menuDiv.classList.toggle('visible');
            toggleBtn.classList.toggle('active');
        });

        menuDiv.addEventListener('click', function(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            var mode = btn.getAttribute('data-mode');
            if (!mode) return;
            ORIENTATION_MODE = mode;
            localStorage.setItem('mdz_orientation', mode);
            menuDiv.classList.remove('visible');
            toggleBtn.classList.remove('active');
            applyOrientation();
        });

        // Close menu when clicking elsewhere
        document.addEventListener('click', function() {
            menuDiv.classList.remove('visible');
            toggleBtn.classList.remove('active');
        });

        // ═══════════════════════════════════════
        // Touch simulation helper
        // ═══════════════════════════════════════
        function simulateTouch(type, clientX, clientY, id) {
            id = id || 0;
            var touchObj = new Touch({
                identifier: id,
                target: canvas,
                clientX: clientX, clientY: clientY,
                pageX: clientX, pageY: clientY,
                radiusX: 5, radiusY: 5,
                rotationAngle: 0,
                force: 1
            });

            var activeTouches = (type === 'end' || type === 'cancel') ? [] : [touchObj];
            try {
                var evt = new TouchEvent('touch' + type, {
                    bubbles: true,
                    cancelable: true,
                    touches: activeTouches,
                    targetTouches: activeTouches,
                    changedTouches: [touchObj]
                });
                canvas.dispatchEvent(evt);
            } catch(e) {
                var evt2 = document.createEvent('UIEvents');
                evt2.initUIEvent('touch' + type, true, true);
                canvas.dispatchEvent(evt2);
            }
        }

        // ═══════════════════════════════════════
        // Input proxy — portrait mode intercept
        // Transforms screen coords → canvas coords
        // before dispatching to the canvas
        // ═══════════════════════════════════════
        function proxyEvent(type, e) {
            if (!isPortraitMode) return;
            e.preventDefault();
            e.stopPropagation();

            var clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            var c = screenToCanvas(clientX, clientY);
            simulateTouch(type, c.x, c.y, 1);
        }

        inputProxy.addEventListener('touchstart',  function(e) { proxyEvent('start', e); }, {passive: false});
        inputProxy.addEventListener('touchmove',   function(e) { proxyEvent('move',  e); }, {passive: false});
        inputProxy.addEventListener('touchend',    function(e) { proxyEvent('end',   e); }, {passive: false});
        inputProxy.addEventListener('touchcancel', function(e) { proxyEvent('cancel',e); }, {passive: false});
        inputProxy.addEventListener('mousedown',   function(e) { proxyEvent('start', e); });
        inputProxy.addEventListener('mousemove',   function(e) { if (e.buttons & 1) proxyEvent('move', e); });
        inputProxy.addEventListener('mouseup',     function(e) { proxyEvent('end',   e); });
        inputProxy.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // ═══════════════════════════════════════
        // Landscape mode: mouse → touch directly
        // ═══════════════════════════════════════
        canvas.addEventListener('mousedown', function(e) {
            if (isPortraitMode) return;
            e.preventDefault();
            simulateTouch('start', e.clientX, e.clientY, 2);
        });
        canvas.addEventListener('mousemove', function(e) {
            if (isPortraitMode) return;
            if (e.buttons & 1) {
                simulateTouch('move', e.clientX, e.clientY, 2);
            }
        });
        canvas.addEventListener('mouseup', function(e) {
            if (isPortraitMode) return;
            simulateTouch('end', e.clientX, e.clientY, 2);
        });
        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // ═══════════════════════════════════════
        // WASD keyboard → touch simulation
        // ═══════════════════════════════════════
        var kbState = {};
        var kbTouchActive = false;
        var kbTouchX = GAME_W / 2;
        var kbTouchY = GAME_H / 2;
        var KB_SPEED = 6; // canvas-space pixels per frame

        function updateKbTouch() {
            var dx = 0, dy = 0;
            if (kbState['w'] || kbState['ArrowUp'])    dy -= 1;
            if (kbState['s'] || kbState['ArrowDown'])  dy += 1;
            if (kbState['a'] || kbState['ArrowLeft'])  dx -= 1;
            if (kbState['d'] || kbState['ArrowRight']) dx += 1;

            var moving = (dx !== 0 || dy !== 0);
            if (moving) {
                kbTouchX = Math.max(0, Math.min(GAME_W, kbTouchX + dx * KB_SPEED));
                kbTouchY = Math.max(0, Math.min(GAME_H, kbTouchY + dy * KB_SPEED));

                // Convert canvas coords to screen coords for dispatch
                var screen = canvasToScreen(kbTouchX, kbTouchY);

                if (!kbTouchActive) {
                    kbTouchActive = true;
                    simulateTouch('start', screen.x, screen.y, 3);
                }
                simulateTouch('move', screen.x, screen.y, 3);
            }
            return moving;
        }

        var kbInterval = setInterval(updateKbTouch, 16);

        function resetKbTouch() {
            kbTouchX = GAME_W / 2;
            kbTouchY = GAME_H / 2;
        }

        window.addEventListener('keydown', function(e) {
            kbState[e.key] = true;
            var key = e.key;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar','Escape'].indexOf(key) >= 0) {
                e.preventDefault();
            }
            if (key === ' ' || key === 'Spacebar' || key === 'e' || key === 'E' || key === 'Enter') {
                e.preventDefault();
                resetKbTouch();
                var sc = canvasToScreen(GAME_W / 2, GAME_H / 2);
                simulateTouch('start', sc.x, sc.y, 4);
                setTimeout(function() { simulateTouch('end', sc.x, sc.y, 4); }, 40);
            }
            if (key === 'r' || key === 'R') {
                var sc2 = canvasToScreen(GAME_W * 0.85, GAME_H * 0.9);
                simulateTouch('start', sc2.x, sc2.y, 5);
                setTimeout(function() { simulateTouch('end', sc2.x, sc2.y, 5); }, 40);
            }
            if (key === 'i' || key === 'I' || key === 'Tab') {
                e.preventDefault();
                var sc3 = canvasToScreen(GAME_W * 0.93, GAME_H * 0.5);
                simulateTouch('start', sc3.x, sc3.y, 6);
                setTimeout(function() { simulateTouch('end', sc3.x, sc3.y, 6); }, 40);
            }
            if (key === 'm' || key === 'M') {
                var sc4 = canvasToScreen(GAME_W * 0.07, GAME_H * 0.93);
                simulateTouch('start', sc4.x, sc4.y, 7);
                setTimeout(function() { simulateTouch('end', sc4.x, sc4.y, 7); }, 40);
            }
        });

        window.addEventListener('keyup', function(e) {
            kbState[e.key] = false;
            var anyMove = kbState['w'] || kbState['ArrowUp'] ||
                         kbState['s'] || kbState['ArrowDown'] ||
                         kbState['a'] || kbState['ArrowLeft'] ||
                         kbState['d'] || kbState['ArrowRight'];
            if (!anyMove && kbTouchActive) {
                kbTouchActive = false;
                var sc = canvasToScreen(kbTouchX, kbTouchY);
                simulateTouch('end', sc.x, sc.y, 3);
            }
        });

        // ═══════════════════════════════════════
        // Init
        // ═══════════════════════════════════════
        applyOrientation();

        jQuery(document).ready(function() {
            cr_createRuntime("c2canvas");
            setTimeout(function() {
                loadingScreen.classList.add('hidden');
            }, 2000);
        });

        // Pause / Resume on tab switch
        function onVisibilityChanged() {
            var hidden = document.hidden || document.mozHidden || document.webkitHidden || document.msHidden;
            if (typeof cr_setSuspended === 'function') {
                cr_setSuspended(hidden);
            }
        }
        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

    })();
    </script>
</body>
</html>
