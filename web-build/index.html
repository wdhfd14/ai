<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Mini DAYZ - Web Edition</title>

    <link rel="manifest" href="appmanifest.json" />
    <link rel="icon" type="image/png" sizes="256x256" href="icon-256.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -ms-touch-action: none;
            font-family: Arial, sans-serif;
        }
        canvas {
            touch-action-delay: none;
            touch-action: none;
            -ms-touch-action: none;
            image-rendering: auto;
            display: block;
        }

        /* ── 外层：铺满视口 ── */
        #game-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
        }

        /* ── canvas 容器：始终居中 ── */
        #canvas-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 竖屏时 canvas-area 只占上面一部分 */
        #game-wrapper.portrait #canvas-area {
            height: auto;
            position: absolute;
            top: 0; left: 0; right: 0;
            bottom: 42%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── 虚拟触控区：竖屏时可见 ── */
        #ctrl-area {
            display: none;
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 42%;
            background: #0a0a0a;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-wrapper.portrait #ctrl-area { display: flex; }

        /* 方向键 — 十字布局 */
        #dpad {
            position: relative;
            width: 160px; height: 160px;
            flex-shrink: 0;
        }
        .dpad-btn {
            position: absolute;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            width: 50px; height: 50px;
            cursor: pointer;
            touch-action: none;
            transition: background 0.08s;
        }
        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.35);
        }
        .dpad-up    { top: 0;   left: 55px; }
        .dpad-down  { top: 110px; left: 55px; }
        .dpad-left  { top: 55px; left: 0; }
        .dpad-right { top: 55px; left: 110px; }
        .dpad-center {
            top: 55px; left: 55px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 右侧动作按钮 */
        #action-btns {
            display: flex;
            flex-direction: row;
            gap: 12px;
            flex-shrink: 0;
        }
        .act-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.15);
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.08s, border-color 0.08s;
        }
        .act-btn:active, .act-btn.pressed {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.45);
            color: #fff;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-text {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #loading-bar-bg {
            width: 200px; height: 3px;
            background: #222;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        #loading-bar {
            width: 0%; height: 100%;
            background: #4a4;
            transition: width 0.4s ease;
        }
        #kb-hint {
            position: fixed;
            bottom: 10px; right: 10px;
            color: #555; font-size: 10px;
            z-index: 1000; pointer-events: none;
        }

        /* ── 方向设置面板 ── */
        #orientation-settings {
            position: fixed;
            top: 10px; right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        #orientation-toggle {
            width: 36px; height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc; font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background 0.2s, color 0.2s;
        }
        #orientation-toggle:hover, #orientation-toggle.active {
            background: rgba(0,0,0,0.75);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }
        #orientation-menu {
            display: none;
            flex-direction: column;
            gap: 2px;
            background: rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 4px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #orientation-menu.visible { display: flex; }
        #orientation-menu button {
            background: none;
            border: 1px solid transparent;
            color: #bbb; font-size: 12px;
            padding: 7px 14px;
            text-align: left; cursor: pointer;
            border-radius: 5px; white-space: nowrap;
            transition: all 0.15s;
        }
        #orientation-menu button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        #orientation-menu button.selected {
            color: #5f5;
            border-color: rgba(100,255,100,0.4);
            background: rgba(100,255,100,0.08);
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div id="loading-text">Mini DAYZ Loading</div>
        <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    </div>

    <!-- 游戏外层容器 — 竖屏时 flex column 分上下 -->
    <div id="game-wrapper">
        <div id="canvas-area">
            <div id="game-container">
                <canvas id="c2canvas" width="1024" height="768">
                    <h1>Your browser does not support HTML5. Please upgrade.</h1>
                </canvas>
            </div>
        </div>
        <!-- 竖屏时底部的虚拟触控区 -->
        <div id="ctrl-area">
            <div id="dpad">
                <div class="dpad-btn dpad-up"    data-dir="up"></div>
                <div class="dpad-btn dpad-left"  data-dir="left"></div>
                <div class="dpad-btn dpad-center"></div>
                <div class="dpad-btn dpad-right" data-dir="right"></div>
                <div class="dpad-btn dpad-down"  data-dir="down"></div>
            </div>
            <div id="action-btns">
                <button class="act-btn" data-act="interact">&#x270B;</button>
                <button class="act-btn" data-act="inventory">&#x1F392;</button>
                <button class="act-btn" data-act="map">&#x1F5FA;</button>
            </div>
        </div>
    </div>

    <!-- 方向设置 -->
    <div id="orientation-settings">
        <button id="orientation-toggle" title="Screen Orientation">&#x2699;</button>
        <div id="orientation-menu">
            <button data-mode="auto"   class="selected">Auto</button>
            <button data-mode="landscape">Landscape</button>
            <button data-mode="portrait">Portrait</button>
        </div>
    </div>

    <div id="kb-hint">WASD move &bull; Mouse click interact</div>

    <!-- Cordova API polyfill for pure browser environment -->
    <script src="cordova-polyfill.js"></script>

    <!-- Core game engine -->
    <script src="jquery-3.4.1.min.js"></script>
    <script src="c2runtime.js"></script>

    <!-- AI Modules -->
    <script src="src/ai_modules/ai_helpers.js"></script>
    <script src="src/ai_modules/damage_system.js"></script>
    <script src="src/ai_modules/world/map_generation.js"></script>
    <script src="src/ai_modules/world/spawn_parameters.js"></script>
    <script src="src/ai_modules/world/environment.js"></script>
    <script src="src/ai_modules/world/environment_effects.js"></script>
    <script src="src/ai_modules/world/buildings.js"></script>
    <script src="src/ai_modules/world/light_parameters.js"></script>
    <script src="src/ai_modules/world/timeline.js"></script>
    <script src="src/ai_modules/player/player_stats.js"></script>
    <script src="src/ai_modules/player/interaction.js"></script>
    <script src="src/ai_modules/player/experience.js"></script>
    <script src="src/ai_modules/player/animations.js"></script>
    <script src="src/ai_modules/player/characters.js"></script>
    <script src="src/ai_modules/zombies/zeds_common.js"></script>
    <script src="src/ai_modules/zombies/normal_puncher.js"></script>
    <script src="src/ai_modules/zombies/fast_puncher.js"></script>
    <script src="src/ai_modules/zombies/army_puncher.js"></script>
    <script src="src/ai_modules/zombies/buried_puncher.js"></script>
    <script src="src/ai_modules/zombies/army_shooters.js"></script>
    <script src="src/ai_modules/zombies/screamer.js"></script>
    <script src="src/ai_modules/zombies/tank.js"></script>
    <script src="src/ai_modules/zombies/jumper.js"></script>
    <script src="src/ai_modules/bots.js"></script>
    <script src="src/ai_modules/animals.js"></script>
    <script src="src/ai_modules/npc_controller.js"></script>
    <script src="src/ai_modules/vehicles/drivable_vehicles.js"></script>
    <script src="src/ai_modules/gui/hud.js"></script>
    <script src="src/ai_modules/system/save_system.js"></script>
    <script src="src/ai_modules/system/game_init.js"></script>
    <script src="src/game-main.js"></script>

    <script>
    (function() {
        var canvas = document.getElementById('c2canvas');
        var wrapper = document.getElementById('game-wrapper');
        var loadingScreen = document.getElementById('loading-screen');
        var GAME_W = 1024, GAME_H = 768;

        // ═══════════════════════════════════════
        // 方案：完全不旋转画布。横屏=全屏，竖屏=画布置顶+底部触控
        // ═══════════════════════════════════════
        var ORIENTATION_MODE = localStorage.getItem('mdz_orientation') || 'auto';
        var isPortraitMode = false;

        function getEffectiveOrientation() {
            if (ORIENTATION_MODE === 'portrait')  return 'portrait';
            if (ORIENTATION_MODE === 'landscape') return 'landscape';
            return (window.innerHeight > window.innerWidth) ? 'portrait' : 'landscape';
        }

        function applyOrientation() {
            isPortraitMode = (getEffectiveOrientation() === 'portrait');

            if (isPortraitMode) {
                wrapper.classList.add('portrait');
                // 画布撑满上方区域宽度
                var areaH = window.innerHeight * 0.58;
                var scale = Math.min(window.innerWidth / GAME_W, areaH / GAME_H);
                canvas.style.width  = Math.floor(GAME_W * scale) + 'px';
                canvas.style.height = Math.floor(GAME_H * scale) + 'px';
            } else {
                wrapper.classList.remove('portrait');
                var scale2 = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
                canvas.style.width  = Math.floor(GAME_W * scale2) + 'px';
                canvas.style.height = Math.floor(GAME_H * scale2) + 'px';
            }

            // 菜单选中态
            var btns = document.querySelectorAll('#orientation-menu button');
            btns.forEach(function(b) {
                b.classList.toggle('selected', b.getAttribute('data-mode') === ORIENTATION_MODE);
            });
        }

        window.addEventListener('resize', applyOrientation);
        window.addEventListener('orientationchange', function() { setTimeout(applyOrientation, 150); });

        // ═══════════════════════════════════════
        // 设置菜单
        // ═══════════════════════════════════════
        (function() {
            var tg = document.getElementById('orientation-toggle');
            var md = document.getElementById('orientation-menu');
            tg.addEventListener('click', function(e) {
                e.stopPropagation();
                md.classList.toggle('visible');
                tg.classList.toggle('active');
            });
            md.addEventListener('click', function(e) {
                var b = e.target.closest('button');
                if (!b) return;
                var m = b.getAttribute('data-mode');
                if (!m) return;
                ORIENTATION_MODE = m;
                localStorage.setItem('mdz_orientation', m);
                md.classList.remove('visible');
                tg.classList.remove('active');
                applyOrientation();
            });
            document.addEventListener('click', function() {
                md.classList.remove('visible');
                tg.classList.remove('active');
            });
        })();

        // ═══════════════════════════════════════
        // 通用触摸模拟
        // ═══════════════════════════════════════
        function simulateTouch(type, clientX, clientY, id) {
            id = id || 0;
            var t = new Touch({
                identifier: id, target: canvas,
                clientX: clientX, clientY: clientY,
                pageX: clientX, pageY: clientY,
                radiusX: 5, radiusY: 5,
                rotationAngle: 0, force: 1
            });
            var at = (type === 'end' || type === 'cancel') ? [] : [t];
            try {
                canvas.dispatchEvent(new TouchEvent('touch' + type, {
                    bubbles: true, cancelable: true,
                    touches: at, targetTouches: at, changedTouches: [t]
                }));
            } catch(e) {
                var ev = document.createEvent('UIEvents');
                ev.initUIEvent('touch' + type, true, true);
                canvas.dispatchEvent(ev);
            }
        }

        function screenToCanvas(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            return {
                x: ((clientX - rect.left) / rect.width)  * GAME_W,
                y: ((clientY - rect.top)  / rect.height) * GAME_H
            };
        }
        function canvasToScreen(cx, cy) {
            var rect = canvas.getBoundingClientRect();
            return {
                x: rect.left + (cx / GAME_W) * rect.width,
                y: rect.top  + (cy / GAME_H) * rect.height
            };
        }

        // ═══════════════════════════════════════
        // 鼠标 → 触摸 (始终在canvas上)
        // ═══════════════════════════════════════
        canvas.addEventListener('mousedown', function(e) {
            e.preventDefault();
            simulateTouch('start', e.clientX, e.clientY, 2);
        });
        canvas.addEventListener('mousemove', function(e) {
            if (e.buttons & 1) simulateTouch('move', e.clientX, e.clientY, 2);
        });
        canvas.addEventListener('mouseup', function(e) {
            simulateTouch('end', e.clientX, e.clientY, 2);
        });
        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // ═══════════════════════════════════════
        // 竖屏虚拟 D-Pad
        // ═══════════════════════════════════════
        var dpadState = { up: false, down: false, left: false, right: false };
        var dpadTouchActive = false;
        var dpadTouchX = GAME_W / 2, dpadTouchY = GAME_H / 2;
        var DPAD_SPEED = 7;

        function bindDpadBtn(sel, dir) {
            var el = document.querySelector(sel);
            if (!el) return;

            function on(ev) { ev.preventDefault(); dpadState[dir] = true; el.classList.add('pressed'); }
            function off(ev) { ev.preventDefault(); dpadState[dir] = false; el.classList.remove('pressed'); }

            el.addEventListener('mousedown', on);
            el.addEventListener('touchstart', on, {passive: false});
            el.addEventListener('mouseup', off);
            el.addEventListener('mouseleave', off);
            el.addEventListener('touchend', off);
            el.addEventListener('touchcancel', off);
        }

        bindDpadBtn('.dpad-up',    'up');
        bindDpadBtn('.dpad-down',  'down');
        bindDpadBtn('.dpad-left',  'left');
        bindDpadBtn('.dpad-right', 'right');

        function updateDpadTouch() {
            var dx = 0, dy = 0;
            if (dpadState.up)    dy -= 1;
            if (dpadState.down)  dy += 1;
            if (dpadState.left)  dx -= 1;
            if (dpadState.right) dx += 1;
            var moving = (dx !== 0 || dy !== 0);

            if (moving) {
                dpadTouchX = Math.max(0, Math.min(GAME_W, dpadTouchX + dx * DPAD_SPEED));
                dpadTouchY = Math.max(0, Math.min(GAME_H, dpadTouchY + dy * DPAD_SPEED));
                var sc = canvasToScreen(dpadTouchX, dpadTouchY);
                if (!dpadTouchActive) { dpadTouchActive = true; simulateTouch('start', sc.x, sc.y, 10); }
                simulateTouch('move', sc.x, sc.y, 10);
            }
            return moving;
        }

        setInterval(function() {
            if (!isPortraitMode) return;
            var m = updateDpadTouch();
            if (!m && dpadTouchActive) {
                dpadTouchActive = false;
                var sc = canvasToScreen(dpadTouchX, dpadTouchY);
                simulateTouch('end', sc.x, sc.y, 10);
            }
        }, 16);

        // D-Pad 释放时重置位置
        function resetDpadPos() {
            dpadTouchX = GAME_W / 2;
            dpadTouchY = GAME_H / 2;
        }

        // ═══════════════════════════════════════
        // 竖屏动作按钮
        // ═══════════════════════════════════════
        function bindActBtn(sel, canvasX, canvasY) {
            var el = document.querySelector(sel);
            if (!el) return;

            function press(e) {
                e.preventDefault();
                el.classList.add('pressed');
                resetDpadPos();
                var sc = canvasToScreen(canvasX, canvasY);
                simulateTouch('start', sc.x, sc.y, 20);
            }
            function release(e) {
                e.preventDefault();
                el.classList.remove('pressed');
                var sc = canvasToScreen(canvasX, canvasY);
                simulateTouch('end', sc.x, sc.y, 20);
            }

            el.addEventListener('mousedown', press);
            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
            el.addEventListener('touchend', release);
            el.addEventListener('touchcancel', release);
        }

        // 交互按钮 → 点击画布中心
        bindActBtn('.act-btn[data-act="interact"]', GAME_W * 0.5, GAME_H * 0.55);
        // 背包按钮 → 点击右侧
        bindActBtn('.act-btn[data-act="inventory"]', GAME_W * 0.93, GAME_H * 0.5);
        // 地图按钮 → 点击左下角
        bindActBtn('.act-btn[data-act="map"]',        GAME_W * 0.07, GAME_H * 0.93);

        // ═══════════════════════════════════════
        // WASD (全模式)
        // ═══════════════════════════════════════
        var kbState = {};
        var kbTouchActive = false;
        var kbTouchX = GAME_W / 2, kbTouchY = GAME_H / 2;
        var KB_SPEED = 6;

        function updateKbTouch() {
            var dx = 0, dy = 0;
            if (kbState['w'] || kbState['ArrowUp'])    dy -= 1;
            if (kbState['s'] || kbState['ArrowDown'])  dy += 1;
            if (kbState['a'] || kbState['ArrowLeft'])  dx -= 1;
            if (kbState['d'] || kbState['ArrowRight']) dx += 1;
            var moving = (dx !== 0 || dy !== 0);
            if (moving) {
                kbTouchX = Math.max(0, Math.min(GAME_W, kbTouchX + dx * KB_SPEED));
                kbTouchY = Math.max(0, Math.min(GAME_H, kbTouchY + dy * KB_SPEED));
                var sc = canvasToScreen(kbTouchX, kbTouchY);
                if (!kbTouchActive) { kbTouchActive = true; simulateTouch('start', sc.x, sc.y, 3); }
                simulateTouch('move', sc.x, sc.y, 3);
            }
            return moving;
        }
        setInterval(updateKbTouch, 16);

        window.addEventListener('keydown', function(e) {
            kbState[e.key] = true;
            var key = e.key;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Escape'].indexOf(key) >= 0) e.preventDefault();
            if (key === ' ' || key === 'e' || key === 'E' || key === 'Enter') {
                e.preventDefault();
                kbTouchX = GAME_W / 2; kbTouchY = GAME_H / 2;
                var sc = canvasToScreen(GAME_W / 2, GAME_H / 2);
                simulateTouch('start', sc.x, sc.y, 4);
                setTimeout(function() { simulateTouch('end', sc.x, sc.y, 4); }, 40);
            }
            if (key === 'r' || key === 'R') {
                var sc = canvasToScreen(GAME_W * 0.85, GAME_H * 0.9);
                simulateTouch('start', sc.x, sc.y, 5);
                setTimeout(function() { simulateTouch('end', sc.x, sc.y, 5); }, 40);
            }
            if (key === 'i' || key === 'I' || key === 'Tab') {
                e.preventDefault();
                var sc = canvasToScreen(GAME_W * 0.93, GAME_H * 0.5);
                simulateTouch('start', sc.x, sc.y, 6);
                setTimeout(function() { simulateTouch('end', sc.x, sc.y, 6); }, 40);
            }
            if (key === 'm' || key === 'M') {
                var sc = canvasToScreen(GAME_W * 0.07, GAME_H * 0.93);
                simulateTouch('start', sc.x, sc.y, 7);
                setTimeout(function() { simulateTouch('end', sc.x, sc.y, 7); }, 40);
            }
        });
        window.addEventListener('keyup', function(e) {
            kbState[e.key] = false;
            if (!kbTouchActive) return;
            var any = kbState['w']||kbState['ArrowUp']||kbState['s']||kbState['ArrowDown']||
                      kbState['a']||kbState['ArrowLeft']||kbState['d']||kbState['ArrowRight'];
            if (!any) {
                kbTouchActive = false;
                var sc = canvasToScreen(kbTouchX, kbTouchY);
                simulateTouch('end', sc.x, sc.y, 3);
            }
        });

        // ═══════════════════════════════════════
        // Boot
        // ═══════════════════════════════════════
        applyOrientation();

        jQuery(document).ready(function() {
            cr_createRuntime("c2canvas");
            setTimeout(function() { loadingScreen.classList.add('hidden'); }, 2000);
        });

        function onVisibilityChanged() {
            var h = document.hidden || document.mozHidden || document.webkitHidden || document.msHidden;
            if (typeof cr_setSuspended === 'function') cr_setSuspended(h);
        }
